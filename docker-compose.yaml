version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: toentoen_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api-server:
    build: .
    container_name: toentoen_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres-db 
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FONNTE_TOKEN=${FONNTE_TOKEN}
    depends_on:
      - postgres-db

  migrator:
      image: migrate/migrate
      container_name: toentoen_migrator
      depends_on:
        - postgres-db
      volumes:
        - ./pkg/database/migrations:/migrations
      command:
        - -path=/migrations
        - -database=postgres://${DB_USER}:${DB_PASSWORD}@postgres-db:${DB_PORT}/${DB_NAME}?sslmode=disable
        - up

volumes:
  pgdata: