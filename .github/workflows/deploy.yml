name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Eksekusi Deployment ke Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            # 1. Buka folder project
            cd ~/webapi-go
            
            # 2. Tarik kode terbaru
            git pull origin main
            
            # 3. Buat Swap Memory secara otomatis jika belum ada (Bypass OOM / Crash)
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            
            # 4. Pastikan semua service backend pendukung menyala
            sudo docker-compose up -d postgres-db redis-cache meilisearch
            
            # 5. Build ulang API server (proses ini aman karena sudah ada swap)
            sudo docker-compose up -d --build api-server
            
            # 6. Jalankan migrator database
            sudo docker-compose up -d migrator
            
            # 7. Bersihkan image usang agar storage tidak penuh
            sudo docker image prune -f